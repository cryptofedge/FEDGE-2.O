<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#06060F" />
  <meta name="apple-mobile-web-app-title" content="Wealthyverse" />
  <meta name="description" content="It's a Mindset, Not a Goal. FEDGE 2.O: The Wealthyverse, a first-person walk through the city of generational wealth." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <title>FEDGE 2.O: The Wealthyverse — Credit Ave</title>
  <style>
    /* Boot screen: the "Digital Commute" art from the first paint, before the game script arrives. Styled inline so it
       shows before the stylesheet; TitleScreen.setReady() fades it out onto the live city. Same layout as the train ride. */
    #boot { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #06060F; transition: opacity 0.9s ease; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot img { position: absolute; }
    /* the 1376x768 picture fills the whole screen, pinned to the top so the title always shows; the sheen runs along
       the loading bar painted into it, or along the bottom edge on screens wider than the picture (its bar is cropped) */
    #boot .boot-frame { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: max(100vw, calc(100vh * 1376 / 768)); height: max(100vh, calc(100vw * 768 / 1376)); }
    #boot .boot-art { inset: 0; width: 100%; height: 100%; }
    #boot .boot-bar { position: absolute; left: 3.4%; width: 93.3%; top: 92.9%; height: 1%; border-radius: 3px; overflow: hidden; }
    @media (min-aspect-ratio: 1376/768) { #boot .boot-bar { top: calc(100vh - 14px - env(safe-area-inset-bottom)); height: 4px; background: rgba(255,255,255,0.16); } }
    #boot .boot-bar i { display: block; width: 18%; height: 100%; background: linear-gradient(90deg, transparent, #b8ffd6, transparent); box-shadow: 0 0 12px #4ade80; animation: bootBar 1.8s ease-in-out infinite; }
    @keyframes bootBar { 0% { transform: translateX(-110%); } 100% { transform: translateX(560%); } }
  </style>
  <script type="module" crossorigin src="./assets/index-D1LtgSTJ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BMgOe07C.css">
</head>
<body>
  <div id="boot" role="progressbar" aria-label="Loading The Wealthyverse">
    <div class="boot-frame"><img class="boot-art" src="loading/digital-commute.jpg" alt=""><div class="boot-bar"><i></i></div></div>
  </div>
  <div id="app"></div>
  <!-- No Tesana SDK here: src/core/tesanaStub.ts stands in for it, so nothing loads from a CDN or reports play stats. -->
</body>
</html>
